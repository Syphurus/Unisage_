<!doctype html>
<html>
  <head>
    <title>Quiz Data Structure Test</title>
    <style>
      body {
        font-family: monospace;
        background: #f5f5f5;
        padding: 20px;
      }
      .section {
        background: white;
        padding: 15px;
        margin: 10px 0;
        border-left: 4px solid #0066cc;
      }
      pre {
        background: #f0f0f0;
        padding: 10px;
        overflow-x: auto;
        font-size: 11px;
        max-height: 400px;
      }
    </style>
  </head>
  <body>
    <h1>Quiz Data Structure Test</h1>

    <div id="output"></div>

    <script>
      (async () => {
        const output = document.getElementById("output");
        const log = (text) => {
          const div = document.createElement("div");
          div.style.marginBottom = "10px";
          div.textContent = text;
          output.appendChild(div);
        };

        const logCode = (label, code) => {
          const div = document.createElement("div");
          div.className = "section";
          div.innerHTML = `<strong>${label}</strong><pre>${code}</pre>`;
          output.appendChild(div);
        };

        try {
          log("Fetching quiz content data...");
          const resp = await fetch(
            "http://localhost:3000/api/subjects/b29817e9-6395-4f76-b361-da867efce6bc/content"
          );
          const data = await resp.json();
          const quizzes = data.data.content.quiz;

          if (quizzes && quizzes.length > 0) {
            const quiz = quizzes[0];
            logCode("First Quiz Structure:", JSON.stringify(quiz, null, 2));

            if (quiz.data) {
              logCode("Quiz Data Keys:", Object.keys(quiz.data).join(", "));

              if (quiz.data.mini_quizzes) {
                logCode(
                  "Mini Quizzes:",
                  JSON.stringify(quiz.data.mini_quizzes, null, 2)
                );
              }

              if (quiz.data.unit_quiz) {
                logCode(
                  "Unit Quiz:",
                  JSON.stringify(quiz.data.unit_quiz, null, 2)
                );
              }

              if (quiz.data.true_false) {
                logCode(
                  "True/False:",
                  JSON.stringify(quiz.data.true_false, null, 2)
                );
              }

              if (quiz.data.fill_in_blanks) {
                logCode(
                  "Fill in Blanks:",
                  JSON.stringify(quiz.data.fill_in_blanks, null, 2)
                );
              }
            }
          }
        } catch (err) {
          log(`ERROR: ${err.message}`);
        }
      })();
    </script>
  </body>
</html>
